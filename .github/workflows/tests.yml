name: Tests and wheel

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
      - run: python -m pip install '.[test]' build
      - run: python -m pytest gespo/tests -q
      - run: python -m build --wheel
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Check installed wheel outside the checkout
        working-directory: /tmp
        run: |
          python -c "from gespo.utils.diagnostics_plugins.adk_feature_kmeans import plot_feature_pairs; from gespo.utils.path_boundary_plugins.adk_feature_kmeans import adk_feature_kmeans_boundaries"
          gespo --help
