data:
  pdb: /home/zpengmei/Apps/GESPO/examples/chignolin/chignolin.pdb
  traj_dir: /home/zpengmei/Apps/GESPO/examples/chignolin/run_snaps
  traj_pattern:
    - "epoch_*/*.dcd"
    - "epoch_*/transition/*.dcd"
  conditioning_mode: torsion
  cond_injection_mode: per_residue
  frame_stride: 2
  align: true

model:
  d_model: 256
  latent_dim: 256
  nhead: 8
  num_layers_intra: 4
  num_layers_inter: 4
  num_residue_sinks: 2
  dropout: 0.0
  atom_mixer: transformer   # options: transformer, gated_deltanet

training:
  work_dir: /home/zpengmei/Apps/GESPO/examples/chignolin_torsion
  checkpoint_path: /home/zpengmei/Apps/GESPO/examples/chignolin_torsion/checkpoints/diffusion.pth
  device: auto
  batch_size: 128
  epochs: 100
  lr: 2.0e-4
  diffusion_steps: 1000
